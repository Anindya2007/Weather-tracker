<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="Weather.css">
</head>

<body>
    <div id="landing-page">
        <h1>DECODE THE SKY</h1>
        <h3>Real-time weather insights for your next big adventure.</h3>
        <button id="enter-btn">EXPLORE NOW</button>
    </div>

   <div id="user-interface">
    <div id="data-background">
        <nav id="navbar">
            <ul>
                <input type="text" id="city-input" placeholder="Enter city name">
                <button id="search-btn">🔍︎</button>
                <div>
                    <li style="text-align: center; font-size: 186x;">彡</li>
                    <li>Air Quality</li>
                </div>
                
                <div>
                    <li style="text-align: center;font-size: 16px;">📡</li>
                    <li>Forecast</li>
                </div>
            </ul>
        </nav>

        <div id="data-space">

            <!--  Weather details will be displayed here -->
            <div id="weather-div">

                <div id="city-card">
                    <div id="city-div">
                        <h2 style="font-size: 40px;">Delhi</h2>
                        <h1 style="font-size: 60px;">26 F</h1>
                        <h3 style="font-weight: lighter; font-size: 20px;">Cloudy</h3>
                        <h4 style="font-weight: normal; font-size:20px;">34/78</h4>
                    </div>
                </div>

               
                <div id="other-details">
                    
                    <div class="detail-card">
                            <img src="https://tse2.mm.bing.net/th/id/OIP.BSDOhLhA0GaZlxEHTsjLUwHaFO?rs=1&pid=ImgDetMain&o=7&rm=3">
                            <div style="display: inline;">
                                <h3 >Humidity</h3>
                                <h2 style="text-align: center; line-height: 50px;" >80%</h2>
                            </div>
                    </div>

                    <div class="detail-card">
                            <img src="https://images.emojiterra.com/google/android-10/share/1f321.jpg">
                            <div style="display: inline;">
                                <h3 >Apparent</h3>
                                <h2 style="text-align: center; line-height: 50px;" >80 </h2>
                            </div>
                    </div>

                    <div class="detail-card">
                            <img src="https://tse2.mm.bing.net/th/id/OIP.VhwMyHO6JprutbdIXj1uXgHaHa?rs=1&pid=ImgDetMain&o=7&rm=3">
                            <div style="display: inline;">
                                <h3>Wind Velocity</h3>
                                <h2 style="text-align: center; line-height: 50px;" >20 km/hr</h2>
                            </div>
                    </div>
                    
                    <div class="detail-card">
                            <img src="https://st.depositphotos.com/1026280/53601/v/450/depositphotos_536016576-stock-illustration-manometer-scales-pressure-gauge-compression.jpg">
                            <div style="display: inline;">
                                <h3>Pressue</h3>
                                <h2 style="text-align: center; line-height: 50px;" >20 hPa</h2>
                            </div>
                    </div>
                   
                </div>
            </div>

             <!-- Forecast details will be displayed here -->
            <div id="other-days"></div>

        </div>
        </div> 
    </div>

</body>

</html>
