<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="Weather.css">
</head>
<body>
    <div id="landing-page">

        <h3>Real-time weather insights for your next big adventure.</h3>
        <button id="enter-btn">EXPLORE NOW</button>
    </div>

    <div id="user-interface">
        <div id="data-background">
            <nav id="navbar">

                    <li>Air Quality</li>
                    <li>Forecast</li>
                </ul>
            </nav>

            <div id="data-space"></div>
        </div>


        <div id="weather-div"></div>
    </div>

</body>
</html>
